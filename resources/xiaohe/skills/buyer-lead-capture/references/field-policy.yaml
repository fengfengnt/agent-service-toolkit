version: 1
skill_id: buyer.lead_capture
direction: buyer
fields:
- id: companyName
  label: 企业名称
  scope: public
  validator: text
  trim: true
  max_length: 200
  nonblank: true
- id: industry
  label: 行业
  scope: public
- id: companyScale
  label: 企业规模
  scope: public
- id: city
  label: 城市
  scope: public
- id: category
  label: 品类
  scope: request
- id: requirement
  label: 需求描述
  scope: request
- id: annualPurchase
  label: 年采购额
  scope: request
- id: painPoints
  label: 痛点
  scope: request
- id: contactName
  label: 联系人
  scope: request
  validator: text
  trim: true
- id: contactPhone
  label: 联系电话
  scope: request
  validator: text
  trim: true
- id: contactRole
  label: 职务
  scope: request
- id: existingSystems
  label: 现有系统
  scope: request
- id: projectStatus
  label: 立项情况
  scope: request
- id: budget
  label: 预算
  scope: request
- id: desiredTime
  label: 期望时间
  scope: request
- id: decisionProcess
  label: 决策流程
  scope: request
rounds:
- id: round1
  name: 基础资料
  fields:
  - companyName
  - industry
  - companyScale
  - city
- id: round2
  name: 需求和联系信息
  fields:
  - category
  - requirement
  - annualPurchase
  - painPoints
  - contactName
  - contactPhone
  - contactRole
- id: round3
  name: 选填补充
  fields:
  - existingSystems
  - projectStatus
  - budget
  - desiredTime
  - decisionProcess
- id: summary
  name: 核对并确认当前汇总
  fields: []
required_fields:
- companyName
- contactName
- contactPhone
