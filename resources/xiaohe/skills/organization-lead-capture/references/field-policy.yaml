version: 1
skill_id: organization.lead_capture
direction: organization
fields:
- id: organizationName
  label: 组织名称
  scope: public
  validator: text
  trim: true
  min_length: 2
  max_length: 40
  length_on_trimmed: true
- id: organizationType
  label: 组织类型
  scope: public
- id: memberSize
  label: 会员规模
  scope: public
  validator: enum
  input_type: select
  options:
  - 100 家以下
  - 100—500
  - 500—2000
  - 2000 以上
- id: coverage
  label: 覆盖地域
  scope: public
  validator: enum
  input_type: select
  options:
  - 本市
  - 本省
  - 全国
  - 含海外
- id: city
  label: 城市
  scope: public
- id: onlineChannels
  label: 现有线上载体
  scope: public
  validator: channels
  input_type: multiselect
  options:
  - 公众号
  - 小程序
  - APP
  - 官网
  - 微信群
  - 暂无
- id: industries
  label: 行业分布
  scope: public
- id: services
  label: 主要服务
  scope: public
- id: aiNeeds
  label: AI 诉求
  scope: request
- id: contactName
  label: 联系人
  scope: request
  validator: text
  trim: true
  max_length: 100
  nonblank: true
- id: contactPhone
  label: 联系电话
  scope: request
  validator: text
  trim: true
- id: contactRole
  label: 职务
  scope: request
  validator: enum
  input_type: select
  options:
  - 会长
  - 副会长
  - 秘书长
  - 运营负责人
  - 专职工作人员
  - 其他
- id: email
  label: 邮箱
  scope: request
  validator: email
  max_length: 254
- id: activeRatio
  label: 活跃比例
  scope: request
- id: revenueStructure
  label: 收入结构
  scope: request
- id: desiredLaunchTime
  label: 期望上线时间
  scope: request
- id: decisionProcess
  label: 决策流程
  scope: request
- id: resources
  label: 可提供资源
  scope: request
rounds:
- id: round1
  name: 基础资料
  fields:
  - organizationName
  - organizationType
  - memberSize
  - coverage
  - city
  - onlineChannels
- id: round2
  name: 需求和联系信息
  fields:
  - industries
  - services
  - aiNeeds
  - contactName
  - contactPhone
  - contactRole
  - email
- id: round3
  name: 选填补充
  fields:
  - activeRatio
  - revenueStructure
  - desiredLaunchTime
  - decisionProcess
  - resources
- id: summary
  name: 核对并确认当前汇总
  fields: []
required_fields:
- organizationName
- memberSize
- coverage
- onlineChannels
- contactName
- contactPhone
