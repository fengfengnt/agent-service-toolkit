name: yunhezhiyuan
x-business: &business
  image: yunhezhiyuan-aibackend-${VERSION:?run sh deploy/xiaohe/compose.sh to read VERSION}
  build:
    context: ../..
    dockerfile: docker/Dockerfile.xiaohe
  env_file: ${XIAOHE_RUNTIME_ENV_FILE:?set private runtime env file path}
  environment: &business_environment
    DATABASE_TYPE: postgres
    TOOLKIT_BASE_URL: http://api:8080
    XIAOHE_TRUSTED_PROXY_CIDRS: '["172.31.240.2/32"]'
    USE_FAKE_MODEL: 'false'
    LANGCHAIN_TRACING_V2: 'false'
    LANGCHAIN_API_KEY: ''
    LANGFUSE_SECRET_KEY: ''
    SSO_XIAOHE_BRIDGE_ENABLED: 'false'
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
services:
  api:
    <<: *business
    container_name: yunhezhiyuan-aibackend-${VERSION:?run sh deploy/xiaohe/compose.sh to read VERSION}
    command: [api]
    environment:
      <<: *business_environment
      XIAOHE_KNOWLEDGE_ROOT: /var/lib/xiaohe/knowledge
    volumes: [knowledge-data:/var/lib/xiaohe/knowledge]
    expose: ['8080']
    networks:
      private:
      server:
      ingress: {ipv4_address: 172.31.240.3}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/internal/xiaohe/health/ready',timeout=8).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  worker:
    <<: *business
    container_name: yunhezhiyuan-aibackend-${VERSION:?run sh deploy/xiaohe/compose.sh to read VERSION}-worker
    command: [worker]
    networks: [private, server]
    depends_on:
      api: {condition: service_healthy}
      postgres: {condition: service_healthy}
  postgres:
    container_name: yunhezhiyuan-aibackend-pg
    image: postgres@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    environment:
      POSTGRES_USER: xiaohe
      POSTGRES_DB: xiaohe
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD, pg_isready, -U, xiaohe, -d, xiaohe]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  gateway:
    image: nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    environment:
      XIAOHE_PUBLIC_HOST: ${XIAOHE_PUBLIC_HOST:?set registered portal host}
      XIAOHE_SYSTEM_ID: ${XIAOHE_SYSTEM_ID:?set registered system}
    ports: ['${XIAOHE_LISTEN_IP:-127.0.0.1}:${XIAOHE_HTTPS_PORT:-19443}:8443']
    volumes:
      - ./nginx-ai.conf:/etc/nginx/templates/default.conf.template:ro
      - ${XIAOHE_TLS_CERT_FILE:?set certificate file}:/etc/nginx/tls/cert.pem:ro
      - ${XIAOHE_TLS_KEY_FILE:?set private key file}:/etc/nginx/tls/key.pem:ro
    networks:
      ingress: {ipv4_address: 172.31.240.2}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
secrets:
  postgres_password: {file: '${XIAOHE_POSTGRES_PASSWORD_FILE:?set private password file}'}
volumes:
  knowledge-data:
    name: xiaohe_knowledge-data
  postgres-data:
    name: xiaohe_postgres-data
networks:
  server: {external: true, name: "${XIAOHE_SERVER_NETWORK:?set existing Server network}"}
  private: {internal: true}
  ingress:
    ipam:
      config: [{subnet: 172.31.240.0/28}]
