name: xiaohe
x-business: &business
  image: ${XIAOHE_IMAGE:?set immutable business image tag or digest}
  build:
    context: ../..
    dockerfile: docker/Dockerfile.xiaohe
  env_file: ${XIAOHE_RUNTIME_ENV_FILE:?set private runtime env file path}
  environment:
    DATABASE_TYPE: postgres
    TOOLKIT_BASE_URL: http://api:8080
    XIAOHE_MINIO_ENDPOINT: http://minio:9000
    XIAOHE_TRUSTED_PROXY_CIDRS: '["172.31.240.2/32"]'
    USE_FAKE_MODEL: 'false'
    LANGCHAIN_TRACING_V2: 'false'
    LANGCHAIN_API_KEY: ''
    LANGFUSE_SECRET_KEY: ''
    SSO_XIAOHE_BRIDGE_ENABLED: 'false'
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    minio: {condition: service_started}
services:
  api:
    <<: *business
    command: [api]
    expose: ['8080']
    networks:
      private:
      ingress: {ipv4_address: 172.31.240.3}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/internal/xiaohe/health/ready',timeout=8).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  worker:
    <<: *business
    command: [worker]
    networks: [private]
    depends_on:
      api: {condition: service_healthy}
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
  postgres:
    image: postgres@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    environment:
      POSTGRES_USER: xiaohe
      POSTGRES_DB: xiaohe
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD, pg_isready, -U, xiaohe, -d, xiaohe]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  minio:
    image: ghcr.io/coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    platform: linux/amd64
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_BROWSER: 'off'
    secrets: [minio_root_user, minio_root_password]
    command: [server, /data, --console-address, ':9001']
    volumes: [minio-data:/data]
    networks: [private]
    restart: unless-stopped
  gateway:
    image: nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    environment:
      XIAOHE_PUBLIC_HOST: ${XIAOHE_PUBLIC_HOST:?set registered portal host}
      XIAOHE_SYSTEM_ID: ${XIAOHE_SYSTEM_ID:?set registered system}
    ports: ['${XIAOHE_LISTEN_IP:-127.0.0.1}:${XIAOHE_HTTPS_PORT:-19443}:8443']
    volumes:
      - ./nginx-ai.conf:/etc/nginx/templates/default.conf.template:ro
      - ${XIAOHE_TLS_CERT_FILE:?set certificate file}:/etc/nginx/tls/cert.pem:ro
      - ${XIAOHE_TLS_KEY_FILE:?set private key file}:/etc/nginx/tls/key.pem:ro
    networks:
      ingress: {ipv4_address: 172.31.240.2}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
secrets:
  postgres_password: {file: '${XIAOHE_POSTGRES_PASSWORD_FILE:?set private password file}'}
  minio_root_user: {file: '${XIAOHE_MINIO_ROOT_USER_FILE:?set private root user file}'}
  minio_root_password: {file: '${XIAOHE_MINIO_ROOT_PASSWORD_FILE:?set private root password file}'}
volumes:
  postgres-data:
  minio-data:
networks:
  private: {internal: true}
  ingress:
    ipam:
      config: [{subnet: 172.31.240.0/28}]
