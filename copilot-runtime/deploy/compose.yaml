{
  "name": "yunhezhiyuan",
  "services": {
    "aibackend-copilotruntime": {
      "image": "yunhezhiyuan-aibackend-copilotruntime:${COPILOT_RUNTIME_TAG:?set immutable candidate tag}",
      "container_name": "yunhezhiyuan-aibackend-copilotruntime",
      "ports": ["127.0.0.1:18110:3000"],
      "extra_hosts": ["portal.lvh.me:host-gateway"],
      "environment": {
        "XIAOHE_BUSINESS_GATEWAY_URL": "${XIAOHE_BUSINESS_GATEWAY_URL:?set candidate HTTPS gateway}",
        "XIAOHE_PUBLIC_ORIGIN": "${XIAOHE_PUBLIC_ORIGIN:?set registered public origin}",
        "NODE_EXTRA_CA_CERTS": "/run/configs/public-ca.pem",
        "COPILOTKIT_TELEMETRY_DISABLED": "true",
        "DO_NOT_TRACK": "1"
      },
      "configs": [{"source": "copilot-public-ca", "target": "/run/configs/public-ca.pem"}],
      "read_only": true,
      "cap_drop": ["ALL"],
      "security_opt": ["no-new-privileges:true"],
      "init": true,
      "stop_grace_period": "10s",
      "healthcheck": {
        "test": ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"],
        "interval": "10s", "timeout": "3s", "retries": 3
      }
    }
  },
  "configs": {"copilot-public-ca": {"file": "${COPILOT_PUBLIC_CA_FILE:?set public CA file only}"}}
}
