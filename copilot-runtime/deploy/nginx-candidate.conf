# 仅插入 portal.lvh.me server；保留已有 /ai-api 和静态页面。
# Runtime 经 Docker host-gateway 访问同一 HTTPS 站点，需该 server 同时监听 172.17.0.1:443 ssl。
location ^~ /copilot-candidate/copilot-api/ {
    proxy_pass http://127.0.0.1:18110/copilot-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header X-Xiaohe-System-Id "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;
    proxy_intercept_errors off;
}
location ^~ /copilot-candidate/ai-api/ {
    proxy_pass http://127.0.0.1:18111/ai-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Xiaohe-System-Id portal;
    proxy_set_header X-Portal-Client-IP $remote_addr;
    proxy_set_header Authorization "";
    proxy_set_header X-SSO-Bridge-Application-Id "";
    proxy_set_header X-Bridge-Client-IP "";
    proxy_set_header X-Bridge-User-Agent "";
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;
    proxy_intercept_errors off;
}
